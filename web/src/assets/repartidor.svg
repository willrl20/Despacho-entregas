<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Repartidor de DashGo en su moto" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .rueda{transform-box:fill-box;transform-origin:center;animation:girar .5s linear infinite}
    .cuerpo{animation:rebote .35s ease-in-out infinite alternate}
    .calle{animation:avanzar .6s linear infinite}
    .viento{animation:soplar .6s linear infinite}
    @keyframes girar{to{transform:rotate(360deg)}}
    @keyframes rebote{to{transform:translateY(-3px)}}
    @keyframes avanzar{to{transform:translateX(-60px)}}
    @keyframes soplar{from{transform:translateX(0);opacity:1}to{transform:translateX(-40px);opacity:0}}
    @media (prefers-reduced-motion:reduce){.rueda,.cuerpo,.calle,.viento{animation:none}}
  </style>
  <!-- calle -->
  <g class="calle">
    <rect x="0" y="262" width="600" height="4" fill="#1E6670"/>
    <g fill="#FF9F1C" opacity=".55">
      <rect x="10" y="280" width="30" height="4" rx="2"/><rect x="70" y="280" width="30" height="4" rx="2"/>
      <rect x="130" y="280" width="30" height="4" rx="2"/><rect x="190" y="280" width="30" height="4" rx="2"/>
      <rect x="250" y="280" width="30" height="4" rx="2"/><rect x="310" y="280" width="30" height="4" rx="2"/>
      <rect x="370" y="280" width="30" height="4" rx="2"/><rect x="430" y="280" width="30" height="4" rx="2"/>
      <rect x="490" y="280" width="30" height="4" rx="2"/>
    </g>
  </g>
  <!-- lineas de velocidad -->
  <g stroke="#7FE0C9" stroke-width="6" stroke-linecap="round">
    <line class="viento" x1="20" y1="120" x2="60" y2="120"/>
    <line class="viento" x1="5" y1="150" x2="35" y2="150" style="animation-delay:.2s"/>
    <line class="viento" x1="25" y1="180" x2="55" y2="180" style="animation-delay:.4s"/>
  </g>
  <!-- sombra -->
  <ellipse cx="235" cy="262" rx="150" ry="7" fill="#082A2E" opacity=".6"/>
  <g class="cuerpo">
    <!-- caja de reparto -->
    <g transform="translate(78 92) skewX(-8)">
      <rect width="104" height="84" rx="10" fill="#FF9F1C"/>
      <rect x="40" width="22" height="84" fill="#C9740A"/>
    </g>
    <!-- parrilla -->
    <rect x="80" y="176" width="110" height="8" rx="4" fill="#0A2E33"/>
    <!-- carroceria -->
    <path d="M110 200 Q115 175 160 178 L270 178 Q300 176 318 150 L332 128 L348 134 L332 172 Q326 200 300 206 L150 206 Q118 208 110 200 Z" fill="#EAF6F6"/>
    <path d="M150 206 L300 206 Q312 205 320 198 L160 198 Z" fill="#9CC5C7"/>
    <!-- asiento -->
    <path d="M170 170 Q170 160 185 160 L250 160 Q262 160 262 170 L262 178 L170 178 Z" fill="#0A2E33"/>
    <!-- motor -->
    <rect x="175" y="200" width="70" height="26" rx="8" fill="#176470"/>
    <rect x="120" y="208" width="60" height="9" rx="4" fill="#9CC5C7"/>
    <!-- horquilla y manubrio -->
    <path d="M336 132 L362 222" stroke="#9CC5C7" stroke-width="9" stroke-linecap="round"/>
    <path d="M326 112 L346 112" stroke="#0A2E33" stroke-width="9" stroke-linecap="round"/>
    <path d="M334 112 L338 134" stroke="#0A2E33" stroke-width="7" stroke-linecap="round"/>
    <!-- farol -->
    <path d="M344 136 Q362 138 360 152 L346 150 Z" fill="#FF9F1C"/>
    <!-- guardabarro delantero -->
    <path d="M330 206 Q362 184 394 206" fill="none" stroke="#EAF6F6" stroke-width="8" stroke-linecap="round"/>
    <!-- piloto: pierna -->
    <path d="M200 166 L262 172 L256 214" fill="none" stroke="#176470" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M246 216 L278 216" stroke="#0A2E33" stroke-width="12" stroke-linecap="round"/>
    <!-- torso (chaqueta DashGo) -->
    <path d="M190 168 Q186 120 222 98 L252 92 Q264 112 250 136 L236 170 Z" fill="#FF9F1C"/>
    <path d="M206 120 L246 112" stroke="#7FE0C9" stroke-width="5" stroke-linecap="round"/>
    <!-- brazo -->
    <path d="M240 104 L292 124 L326 114" fill="none" stroke="#E88A10" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="326" cy="113" r="9" fill="#0A2E33"/>
    <!-- cuello y casco -->
    <rect x="244" y="80" width="14" height="16" rx="6" fill="#C98A5A"/>
    <circle cx="256" cy="62" r="27" fill="#EAF6F6"/>
    <path d="M232 52 Q256 30 282 50" fill="none" stroke="#FF9F1C" stroke-width="8" stroke-linecap="round"/>
    <path d="M258 58 L284 58 Q286 76 270 78 L258 76 Z" fill="#0A2E33"/>
    <path d="M266 62 L278 62" stroke="#7FE0C9" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- ruedas -->
  <g class="rueda">
    <circle cx="140" cy="226" r="34" fill="#082A2E"/>
    <circle cx="140" cy="226" r="18" fill="#9CC5C7"/>
    <path d="M140 210 V242 M124 226 H156" stroke="#176470" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="rueda">
    <circle cx="362" cy="226" r="34" fill="#082A2E"/>
    <circle cx="362" cy="226" r="18" fill="#9CC5C7"/>
    <path d="M362 210 V242 M346 226 H378" stroke="#176470" stroke-width="5" stroke-linecap="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
